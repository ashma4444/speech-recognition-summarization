{% csrf_token %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Speech Transcription and Summarization</title>
		<!-- Load static files -->
		{% load static %}
		<style>
			.hidden {
				display: none;
			}
			.visible {
				display: block;
			}
		</style>
		<!-- Add custom CSS -->
		<link rel="stylesheet" href="{% static 'css/styles.css' %}" />
		<!-- Add Poppins font from Google Fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<!-- Add Font Awesome Icons -->
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="main">
			<div class="secondary">
				<!-- Main heading -->
				<h1 style="font-size: 50px; font-weight: 300; text-align: center">
					Nepali Speech Processing:
				</h1>

				<!-- Sub heading -->
				<h1
					style="
						font-size: 20px;
						font-weight: 200;
						text-align: center;
						padding-bottom: 35px;
					"
				>
					Converting and Summarizing Audio Data
				</h1>

				<div
					style="
						border: 1px dashed grey;
						padding: 25px;
						text-align: center;
						border-radius: 20px;
					"
				>
					<!-- Record audio -->
					<div class="container">
						<!-- Display recorded audio -->
						<div class="display"></div>

						<!-- Buttons to control audio recording -->
						<div class="controllers"></div>
					</div>

					<!-- Select audio file -->
					<form id="transcribeForm" enctype="multipart/form-data">
						{% csrf_token %}

						<br />
						<label for="audioFile">Choose an audio file:</label>
						<input
							type="file"
							id="audioFile"
							name="audio_file"
							accept="audio/*"
							required
						/><br /><br />

						<!-- Transcribe speech button -->
						<button type="submit" id="transcribeButton">
							<i class="fas fa-microphone"></i> Transcribe
						</button>
					</form>
				</div>

				<!-- Display uploaded audio and corresponding transcription -->
				<div
					style="
						border: 1px dashed grey;
						padding: 25px;
						text-align: center;
						border-radius: 20px;
						margin-top: 35px;
					"
				>
					<h2
						style="
							font-size: 20px;
							font-weight: 200;
							text-align: center;
							padding-bottom: 15px;
						"
					>
						Uploaded Audio:
					</h2>

					<!-- Display error message -->
					<div
						style="display: flex; justify-content: center; padding-bottom: 25px"
					>
						<audio id="audio-player" controls style="display: none">
							Your browser does not support the audio element.
						</audio>
					</div>

					<h2
						style="
							font-size: 20px;
							font-weight: 200;
							text-align: center;
							padding-bottom: 15px;
						"
					>
						Transcription Result:
					</h2>
					<div
						id="responseMessage"
						style="text-align: center; padding-bottom: 35px"
					></div>
				</div>

				<!-- Summarization -->
				<div
					class="hidden"
					id="conditionalDiv"
					style="
						border: 1px dashed grey;
						padding: 25px;
						text-align: center;
						border-radius: 20px;
						margin-top: 35px;
					"
				>
					<h1 style="font-size: 30px; font-weight: 300; text-align: center">
						Text Summarizer
					</h1>
					<br />
					<button
						onclick="summarizeText()"
						style="margin-top: 0px"
						id="summarizeButton"
					>
						Summarize
					</button>
					<h2
						style="
							font-size: 20px;
							font-weight: 200;
							text-align: center;
							padding-bottom: 15px;
						"
					>
						Summary:
					</h2>
					<p id="summaryResult"></p>
				</div>
			</div>
		</div>

		<script>
			// Get the form element and handle the form submission
			document
				.getElementById("transcribeForm")
				.addEventListener("submit", function (event) {
					event.preventDefault();
					const transcribeButton = document.getElementById("transcribeButton");
					transcribeButton.disabled = true; // Disable button
					const formData = new FormData();
					const audioFile = document.getElementById("audioFile").files[0];
					formData.append("audio_file", audioFile);

					const csrftoken = document.querySelector(
						"[name=csrfmiddlewaretoken]"
					).value;

					fetch("/api/transcribe/", {
						method: "POST",
						headers: {
							"X-CSRFToken": csrftoken,
						},
						body: formData,
					})
						.then((response) => response.json())
						.then((data) => {
							// Handle response for transcription and audio display
							if (data.transcription) {
								const div = document.getElementById("conditionalDiv");
								div.classList.remove("hidden");
								div.classList.add("visible");

								// Display the transcription result
								document.getElementById(
									"responseMessage"
								).innerHTML = `Transcription: ${data.transcription}`;
								transcribeButton.disabled = false; // Disable button
							} else if (data.error) {
								document.getElementById(
									"responseMessage"
								).innerHTML = `Error: ${data.error}`;
							}

							// Display audio player for the uploaded file
							const audioPlayer = document.getElementById("audio-player");
							const audioUrl = URL.createObjectURL(audioFile);
							audioPlayer.style.display = "block"; // Show the audio player
							audioPlayer.src = audioUrl; // Set the audio source to the uploaded file
						})
						.catch((error) => {
							document.getElementById("responseMessage").innerHTML =
								"Error: " + error.message;
						});
				});

			// Summarization
			function getCSRFToken() {
				const name = "csrftoken";
				const value = document.cookie
					.split(";")
					.find((cookie) => cookie.trim().startsWith(name + "="));
				return value ? value.split("=")[1] : "";
			}

			async function summarizeText() {
				let text = document.getElementById("responseMessage").innerText;
				text = text.replace("Transcription: ", ""); // Remove "Transcription: " from the text

				const summarizeButton = document.getElementById("summarizeButton");
				summarizeButton.disabled = true; // Disable button

				const csrfToken = getCSRFToken();

				const response = await fetch("/api/summarize/", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						"X-CSRFToken": csrfToken, // Add CSRF token to the headers
					},
					body: JSON.stringify({ text: text }),
				});
				const result = await response.json();
				if (response.ok) {
					document.getElementById("summaryResult").innerText = result.summary;
					summarizeButton.disabled = false; // Disable button
				} else {
					document.getElementById("summaryResult").innerText =
						"Error: " + result.error;
				}
			}
		</script>

		<!-- Link JavaScript -->
		<script src="{% static 'js/recoder.js' %}"></script>
	</body>
</html>
